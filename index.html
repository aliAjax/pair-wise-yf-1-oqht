<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社区天文角 · 观测交接台</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>🔭 社区天文角 · 观测交接台</h1>
  <nav>
    <button class="tab active" data-page="register">观测登记</button>
    <button class="tab" data-page="review">待复核 <span id="reviewBadge" class="badge"></span></button>
    <button class="tab" data-page="summary">当晚摘要</button>
    <button class="tab" data-page="handover">交接页</button>
    <button class="tab" data-page="devices">设备维护</button>
  </nav>
</header>

<main>
  <!-- 登记页 -->
  <section id="page-register" class="page active">
    <h2>观测登记</h2>
    <form id="obsForm">
      <input type="hidden" id="editId">
      <div class="form-grid">
        <label>设备
          <select id="fDevice" required></select>
        </label>
        <label>观测任务
          <select id="fTask" required></select>
        </label>
        <label>观测目标
          <input id="fTarget" required placeholder="如 M31 仙女座星系">
        </label>
        <label>开始时刻
          <input id="fStart" type="datetime-local" required>
        </label>
        <label>结束时刻
          <input id="fEnd" type="datetime-local" required>
        </label>
        <label>云量（%）
          <input id="fCloud" type="number" min="0" max="100" required placeholder="0–100">
        </label>
        <label>目视星等
          <input id="fMag" type="number" step="0.1" required placeholder="如 5.5">
        </label>
        <label>负责人
          <input id="fOwner" required placeholder="姓名">
        </label>
        <label class="check">
          <input id="fMountError" type="checkbox"> 赤道仪报错
        </label>
      </div>
      <div id="editReasonBox" class="hidden">
        <label>修改原因（确认过的记录修改时必须填写，旧版本将保留）
          <input id="fReason" placeholder="如：云量目测修正">
        </label>
      </div>
      <p id="formError" class="error"></p>
      <div class="actions">
        <button type="submit" class="primary">提交登记</button>
        <button type="button" id="cancelEdit" class="hidden">取消修改</button>
      </div>
    </form>

    <h3>全部记录</h3>
    <table id="obsTable">
      <thead>
        <tr><th>设备</th><th>目标</th><th>时段</th><th>云量</th><th>星等</th><th>负责人</th><th>状态</th><th>操作</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- 待复核页 -->
  <section id="page-review" class="page">
    <h2>待复核记录</h2>
    <p class="hint">云量超过四成或赤道仪报错的记录会自动转入待复核，复核确认前不计入当晚摘要。</p>
    <table id="reviewTable">
      <thead>
        <tr><th>设备</th><th>目标</th><th>时段</th><th>云量</th><th>赤道仪</th><th>负责人</th><th>触发原因</th><th>操作</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- 当晚摘要 -->
  <section id="page-summary" class="page">
    <h2>当晚摘要（仅含已确认记录）</h2>
    <div id="summaryBody"></div>
  </section>

  <!-- 交接页 -->
  <section id="page-handover" class="page">
    <h2>交接页</h2>
    <div class="handover-grid">
      <div class="card">
        <h3>⚠️ 未复核任务（请下一班处理）</h3>
        <ul id="handoverPending"></ul>
      </div>
      <div class="card">
        <h3>🛠 故障设备</h3>
        <ul id="handoverFaulty"></ul>
      </div>
    </div>
  </section>

  <!-- 设备维护页 -->
  <section id="page-devices" class="page">
    <h2>设备维护</h2>
    <table id="deviceTable">
      <thead><tr><th>设备</th><th>口径/焦距</th><th>状态</th><th>操作</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<!-- 历史版本弹窗 -->
<dialog id="historyDialog">
  <h3>修改历史</h3>
  <div id="historyBody"></div>
  <form method="dialog"><button>关闭</button></form>
</dialog>

<script src="js/devices.js"></script>
<script src="js/rules.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
